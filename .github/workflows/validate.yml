name: validate
on:
  pull_request:
    paths:
      - 'data/**'
      - 'bucket/**'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'bucket/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dataset
        run: python3 .github/workflows/validate.py
